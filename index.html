<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08080c" />
    <title>Guitar Tuner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tuner" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="grid"></div>

    <main class="app">
      <header class="topbar">
        <span id="status-pill" class="pill">Micrófono apagado</span>
      </header>

      <h1 class="title">Guitar Tuner</h1>

      <div class="mode-toggle" id="mode-toggle">
        <button class="mode-btn active" data-mode="guitar">Guitarra</button>
        <button class="mode-btn" data-mode="chromatic">Cromático</button>
      </div>

      <section class="meter-card" id="meter-card" data-status="silent">
        <div class="note-display">
          <span id="note-name" class="note-name">–</span>
          <span id="note-octave" class="note-octave"></span>
        </div>
        <div id="frequency" class="frequency">0.0 Hz</div>

        <div class="gauge" id="gauge"></div>

        <div id="status-badge" class="status-badge silent">Esperando…</div>
      </section>

      <div class="waveform" id="waveform"></div>

      <div class="tuning-row">
        <label for="tuning-select">Afinación</label>
        <select id="tuning-select"></select>
      </div>

      <div class="string-selector" id="string-selector"></div>
      <p class="hint">Tocá una cuerda para oír su tono de referencia</p>

      <button id="mic-button" class="mic-button">
        <span class="mic-dot"></span>
        <span class="mic-label">Encender micrófono</span>
      </button>

      <div class="ref-row">
        <label for="ref-pitch">Referencia A4</label>
        <input type="range" id="ref-pitch" min="432" max="446" step="1" value="440" />
        <span id="ref-value">440 Hz</span>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
