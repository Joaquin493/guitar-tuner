  <body>
    <div id="grid"></div>

    <main class="app">
      <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">🌙</button>

      <header class="topbar">
        <span id="status-pill" class="pill">Micrófono apagado</span>
      </header>

      <h1 class="title">Guitar Tuner</h1>

      <section class="meter-card" id="meter-card" data-status="silent">
        <div class="note-display">
          <span id="note-name" class="note-name">–</span>
          <span id="note-octave" class="note-octave"></span>
        </div>
        <div id="frequency" class="frequency">0.0 Hz</div>

        <div class="gauge" id="gauge"></div>

        <div id="status-badge" class="status-badge silent">Esperando…</div>

        <canvas id="stability" class="stability"></canvas>
      </section>

      <div class="waveform" id="waveform"></div>

      <div class="tuning-row">
        <label for="tuning-select">Afinación</label>
        <select id="tuning-select"></select>
      </div>

      <div class="string-selector" id="string-selector"></div>
      <p class="hint">Tocá una cuerda para oír su tono de referencia</p>

      <button id="mic-button" class="mic-button">
        <span class="mic-dot"></span>
        <span class="mic-label">Encender micrófono</span>
      </button>

      <div class="ref-row">
        <label for="ref-pitch">Referencia A4</label>
        <input type="range" id="ref-pitch" min="432" max="446" step="1" value="440" />
        <span id="ref-value">440 Hz</span>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
